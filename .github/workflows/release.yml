# Publishes this package to PyPI when a version tag is pushed (v1.2.3 or v1.2.3-beta.0, which PyPI
# reads as 1.2.3b0). No token: PyPI trusts this repository, workflow and the `pypi` environment
# (Trusted Publishing, OIDC).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build packaging
      - name: the tag matches pyproject.toml
        run: |
          python - "$GITHUB_REF_NAME" <<'PY'
          import sys, tomllib
          from packaging.version import Version
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = sys.argv[1].removeprefix("v")
          sys.exit(0 if Version(version) == Version(tag) else f"tag {tag} != pyproject {version}")
          PY
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
